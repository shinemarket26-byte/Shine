<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Store — Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#050505;
  color:#f7f4ec;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#d8b15f;
  display:block;
  font-size:9px;
  letter-spacing:3px;
  margin-top:3px;
}

.badge{
  padding:8px 12px;
  border-radius:20px;
  background:#17130d;
  border:1px solid #3d3321;
  color:#d8b15f;
  font-size:11px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:25px;
}

.card{
  background:#10100f;
  border:1px solid #2c2922;
  border-radius:15px;
  padding:17px;
}

.card small{
  color:#969087;
  font-size:10px;
}

.card b{
  display:block;
  font-size:25px;
  margin-top:7px;
  color:#f3d793;
}

.orders{
  background:#10100f;
  border:1px solid #2c2922;
  border-radius:18px;
  overflow:hidden;
}

.orders-head{
  padding:18px;
  border-bottom:1px solid #2c2922;
}

.orders-head h2{
  font-size:19px;
}

.order{
  padding:17px;
  border-bottom:1px solid #25231f;
}

.order:last-child{
  border-bottom:0;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.invoice{
  color:#d8b15f;
  font-weight:900;
  font-size:12px;
}

.status{
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:900;
}

.waiting{
  background:#302719;
  color:#f3d793;
}

.paid{
  background:#102b20;
  color:#48d99b;
}

.info{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.info div{
  font-size:11px;
}

.info span{
  color:#777169;
  display:block;
  margin-bottom:3px;
}

.empty{
  padding:35px;
  text-align:center;
  color:#777169;
  font-size:12px;
}

@media(max-width:600px){
  body{padding:12px}

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .info{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">
      SHINE
      <span>ADMIN PANEL</span>
    </div>

    <div class="badge">
      ● ADMIN
    </div>
  </header>

  <section class="cards">

    <div class="card">
      <small>Total Order</small>
      <b id="totalOrder">0</b>
    </div>

    <div class="card">
      <small>Menunggu Bayar</small>
      <b id="waitingOrder">0</b>
    </div>

    <div class="card">
      <small>Sudah Dibayar</small>
      <b id="paidOrder">0</b>
    </div>

    <div class="card">
      <small>Selesai</small>
      <b id="doneOrder">0</b>
    </div>

  </section>

  <section class="orders">

    <div class="orders-head">
      <h2>📋 Transaksi</h2>
    </div>

    <div id="orderList">
      <div class="empty">
        Belum ada transaksi.
      </div>
    </div>

  </section>

</div>

<script>

let orders = [];

async function loadOrders(){
  try{
    const response = await fetch('/api/orders');
    const data = await response.json();

    if(data.success){
      orders = data.orders || [];
      render();
    }
  }catch(error){
    console.error(error);
  }
}

loadOrders();
function render(){

  const list = document.getElementById("orderList");

  document.getElementById("totalOrder").textContent =
    orders.length;

  document.getElementById("waitingOrder").textContent =
    orders.filter(x => x.status === "waiting").length;

  document.getElementById("paidOrder").textContent =
    orders.filter(x => x.status === "paid").length;

  document.getElementById("doneOrder").textContent =
    orders.filter(x => x.status === "done").length;

  if(!orders.length){

    list.innerHTML = `
      <div class="empty">
        Belum ada transaksi.
      </div>
    `;

    return;
  }

  list.innerHTML = orders.map(order => `

    <div class="order">

      <div class="order-top">

        <div class="invoice">
          #${order.id}
        </div>

        <div class="status ${order.status}">
          ${getStatus(order.status)}
        </div>

      </div>

      <div class="info">

        <div>
          <span>Username Roblox</span>
          <b>${order.username || "-"}</b>
        </div>

        <div>
          <span>Nama Profil</span>
          <b>${order.display || "-"}</b>
        </div>

        <div>
          <span>Robux</span>
          <b>${Number(order.amount || 0).toLocaleString("id-ID")} Robux</b>
        </div>

        <div>
          <span>Total</span>
          <b>Rp ${Number(order.total || 0).toLocaleString("id-ID")}</b>
        </div>

        <div>
          <span>Pembayaran</span>
          <b>${order.pay || "-"}</b>
        </div>

        <div>
          <span>Waktu</span>
          <b>${order.date || "-"} ${order.time || ""}</b>
        </div>

      </div>

    </div>

  `).join("");

}

function getStatus(status){

  if(status === "paid") return "✓ SUDAH DIBAYAR";

  if(status === "done") return "✓ SELESAI";

  return "MENUNGGU BAYAR";

}

render();

</script>

</body>
</html>
