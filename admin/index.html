<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Order — Roblox Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#080b12;
  color:#fff;
}

button,input{
  font:inherit;
}

.hidden{
  display:none!important;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#18233d 0%,#080b12 45%);
}

.login-box{
  width:100%;
  max-width:400px;
  background:#101522;
  border:1px solid #252d3e;
  border-radius:22px;
  padding:30px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
  width:58px;
  height:58px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#5865f2,#7c3aed);
  font-size:25px;
  margin-bottom:18px;
}

.login-box h1{
  font-size:25px;
  margin-bottom:7px;
}

.login-box p{
  color:#8f9bb0;
  font-size:14px;
  margin-bottom:25px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  color:#aab4c7;
  margin-bottom:7px;
}

.field input{
  width:100%;
  background:#080c14;
  border:1px solid #293245;
  color:white;
  border-radius:11px;
  padding:13px;
  outline:none;
}

.field input:focus{
  border-color:#6675ff;
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:11px;
  padding:12px 16px;
  color:#fff;
  background:#5865f2;
  font-weight:700;
}

.btn:hover{
  filter:brightness(1.1);
}

.btn.full{
  width:100%;
}

.error{
  color:#ff6b6b;
  font-size:13px;
  margin-top:12px;
}

/* ADMIN */
#adminPage{
  min-height:100vh;
}

header{
  height:70px;
  border-bottom:1px solid #202838;
  background:#0c1019;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand strong{
  font-size:17px;
}

.logout{
  background:#1b2230;
  color:#dce2ef;
  border:1px solid #2a3446;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.top h1{
  font-size:28px;
}

.top p{
  color:#8f9bb0;
  margin-top:5px;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#101522;
  border:1px solid #222b3b;
  border-radius:17px;
  padding:20px;
}

.stat-title{
  color:#8995a9;
  font-size:13px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:8px;
}

/* TOOLBAR */
.toolbar{
  background:#101522;
  border:1px solid #222b3b;
  border-radius:17px;
  padding:15px;
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search{
  flex:1;
  background:#080c14;
  border:1px solid #293245;
  border-radius:10px;
  color:#fff;
  padding:12px;
  outline:none;
}

select{
  background:#080c14;
  color:#fff;
  border:1px solid #293245;
  border-radius:10px;
  padding:12px;
}

/* TABLE */
.table-box{
  background:#101522;
  border:1px solid #222b3b;
  border-radius:17px;
  overflow:hidden;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  text-align:left;
  padding:15px;
  font-size:12px;
  color:#7f8ba0;
  text-transform:uppercase;
  background:#0c111b;
}

td{
  padding:15px;
  border-top:1px solid #202838;
  font-size:13px;
}

.order-id{
  color:#7c8cff;
  font-weight:800;
}

.price{
  font-weight:800;
}

.status{
  display:inline-flex;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.pending{
  background:rgba(255,193,7,.12);
  color:#ffc107;
}

.paid{
  background:rgba(34,197,94,.12);
  color:#4ade80;
}

.rejected{
  background:rgba(239,68,68,.12);
  color:#f87171;
}

.action-btn{
  border:0;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  margin-right:5px;
}

.pay{
  background:#166534;
  color:#bbf7d0;
}

.reject{
  background:#7f1d1d;
  color:#fecaca;
}

.empty{
  padding:50px;
  text-align:center;
  color:#7f8ba0;
}

.loading{
  padding:50px;
  text-align:center;
  color:#8793a7;
}

/* MOBILE */
@media(max-width:800px){
  header{
    padding:0 15px;
  }

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .toolbar{
    flex-direction:column;
  }

  .top h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<!-- ==============================
     LOGIN
================================ -->
<section id="loginPage">

  <div class="login-box">

    <div class="logo">🛡️</div>

    <h1>Admin Panel</h1>
    <p>Login untuk memeriksa pembayaran order.</p>

    <div class="field">
      <label>Username</label>
      <input id="username" type="text" placeholder="Username admin">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="Password admin">
    </div>

    <button class="btn full" onclick="login()">
      LOGIN ADMIN
    </button>

    <div id="loginError" class="error"></div>

  </div>

</section>


<!-- ==============================
     ADMIN PAGE
================================ -->
<section id="adminPage" class="hidden">

<header>

  <div class="brand">
    <div class="brand-icon">🛒</div>

    <div>
      <strong>Roblox Store Admin</strong>
    </div>
  </div>

  <button class="btn logout" onclick="logout()">
    Logout
  </button>

</header>


<main class="container">

  <div class="top">

    <div>
      <h1>Order Management</h1>
      <p>Periksa dan verifikasi pembayaran customer.</p>
    </div>

    <div class="actions">
      <button class="btn" onclick="loadOrders()">
        ↻ Refresh
      </button>
    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">TOTAL ORDER</div>
      <div id="totalOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">MENUNGGU</div>
      <div id="pendingOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">DIBAYAR</div>
      <div id="paidOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">DITOLAK</div>
      <div id="rejectedOrders" class="stat-value">0</div>
    </div>

  </div>


  <!-- FILTER -->

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Cari nomor order / nama customer..."
      oninput="renderOrders()"
    >

    <select id="statusFilter" onchange="renderOrders()">
      <option value="ALL">Semua Status</option>
      <option value="MENUNGGU">Menunggu</option>
      <option value="DIBAYAR">Dibayar</option>
      <option value="DITOLAK">Ditolak</option>
    </select>

  </div>


  <!-- TABLE -->

  <div class="table-box">

    <div class="table-scroll">

      <table>

        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Produk</th>
            <th>Total</th>
            <th>Status</th>
            <th>Tanggal</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
        </tbody>

      </table>

    </div>

  </div>

</main>

</section>


<script>

/* ==================================================
   CONFIG
================================================== */

const CONFIG = {

  SUPABASE_URL:
    "https://ncfwwmmxjrqcehchdeyn.supabase.co",

  SUPABASE_KEY:
    "sb_publishable_kyYqRIY3vzVhAOxXqEC0IQ_NggDtT1E",

  /*
    GANTI kalau nama tabel lu bukan "orders"
  */
  TABLE:
    "orders",

  /*
    KOLOM DATABASE
    Sesuaikan dengan database lu.
  */

  COLUMNS: {
    id: "id",
    orderNumber: "order_number",
    customer: "customer_name",
    product: "product_name",
    total: "total",
    status: "status",
    createdAt: "created_at"
  },

  /*
    LOGIN ADMIN

    GANTI username/password ini.
  */

  ADMIN_USERNAME:
    "admin",

  ADMIN_PASSWORD:
    "admin123"

};


/* ==================================================
   VARIABLES
================================================== */

let orders = [];


/* ==================================================
   LOGIN
================================================== */

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(
    username === CONFIG.ADMIN_USERNAME &&
    password === CONFIG.ADMIN_PASSWORD
  ){

    localStorage.setItem(
      "admin_logged_in",
      "true"
    );

    showAdmin();

  }else{

    document.getElementById("loginError").textContent =
      "Username atau password salah.";

  }

}


/* ==================================================
   SHOW ADMIN
================================================== */

function showAdmin(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");

  loadOrders();

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  localStorage.removeItem(
    "admin_logged_in"
  );

  location.reload();

}


/* ==================================================
   CHECK LOGIN
================================================== */

if(
  localStorage.getItem("admin_logged_in")
  === "true"
){

  showAdmin();

}


/* ==================================================
   LOAD ORDERS
================================================== */

async function loadOrders(){

  const body =
    document.getElementById("ordersBody");

  body.innerHTML =
    `<tr>
      <td colspan="7">
        <div class="loading">
          Memuat order...
        </div>
      </td>
    </tr>`;

  try{

    const url =
      CONFIG.SUPABASE_URL +
      "/rest/v1/" +
      CONFIG.TABLE +
      "?select=*" +
      "&order=" +
      CONFIG.COLUMNS.createdAt +
      ".desc";

    const response =
      await fetch(url,{

        method:"GET",

        headers:{
          "apikey":
            CONFIG.SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            CONFIG.SUPABASE_KEY
        }

      });


    if(!response.ok){

      const error =
        await response.text();

      throw new Error(error);

    }


    orders =
      await response.json();


    updateStats();

    renderOrders();

  }catch(error){

    console.error(error);

    body.innerHTML =
      `<tr>
        <td colspan="7">
          <div class="empty">
            ❌ Gagal mengambil order.<br><br>
            ${escapeHTML(error.message)}
          </div>
        </td>
      </tr>`;

  }

}


/* ==================================================
   UPDATE STATS
================================================== */

function updateStats(){

  const status =
    CONFIG.COLUMNS.status;

  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;

  document.getElementById(
    "pendingOrders"
  ).textContent =
    orders.filter(
      x => normalizeStatus(x[status]) === "MENUNGGU"
    ).length;

  document.getElementById(
    "paidOrders"
  ).textContent =
    orders.filter(
      x => normalizeStatus(x[status]) === "DIBAYAR"
    ).length;

  document.getElementById(
    "rejectedOrders"
  ).textContent =
    orders.filter(
      x => normalizeStatus(x[status]) === "DITOLAK"
    ).length;

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(){

  const body =
    document.getElementById("ordersBody");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const filter =
    document
      .getElementById("statusFilter")
      .value;

  const C =
    CONFIG.COLUMNS;


  const filtered =
    orders.filter(order => {

      const orderNumber =
        String(order[C.orderNumber] ?? "");

      const customer =
        String(order[C.customer] ?? "");

      const currentStatus =
        normalizeStatus(order[C.status]);


      const matchSearch =
        orderNumber
          .toLowerCase()
          .includes(search) ||

        customer
          .toLowerCase()
          .includes(search);


      const matchStatus =
        filter === "ALL" ||
        currentStatus === filter;


      return matchSearch &&
             matchStatus;

    });


  if(filtered.length === 0){

    body.innerHTML =
      `<tr>
        <td colspan="7">
          <div class="empty">
            Tidak ada order.
          </div>
        </td>
      </tr>`;

    return;

  }


  body.innerHTML =
    filtered.map(order => {

      const status =
        normalizeStatus(order[C.status]);

      const statusClass =
        status === "DIBAYAR"
          ? "paid"
          : status === "DITOLAK"
            ? "rejected"
            : "pending";


      return `
        <tr>

          <td>
            <span class="order-id">
              ${escapeHTML(order[C.orderNumber] ?? order[C.id] ?? "-")}
            </span>
          </td>

          <td>
            ${escapeHTML(order[C.customer] ?? "-")}
          </td>

          <td>
            ${escapeHTML(order[C.product] ?? "-")}
          </td>

          <td>
            <span class="price">
              ${formatRupiah(order[C.total])}
            </span>
          </td>

          <td>
            <span class="status ${statusClass}">
              ${escapeHTML(status)}
            </span>
          </td>

          <td>
            ${formatDate(order[C.createdAt])}
          </td>

          <td>

            ${
              status !== "DIBAYAR"
              ? `
                <button
                  class="action-btn pay"
                  onclick="changeStatus('${escapeJS(order[C.id])}','DIBAYAR')"
                >
                  ✓ BAYAR
                </button>
              `
              : ""
            }

            ${
              status !== "DITOLAK"
              ? `
                <button
                  class="action-btn reject"
                  onclick="changeStatus('${escapeJS(order[C.id])}','DITOLAK')"
                >
                  ✕ TOLAK
                </button>
              `
              : ""
            }

          </td>

        </tr>
      `;

    }).join("");

}


/* ==================================================
   CHANGE STATUS
================================================== */

async function changeStatus(id,status){

  const text =
    status === "DIBAYAR"
      ? "Tandai order ini sebagai DIBAYAR?"
      : "Tolak pembayaran order ini?";


  if(!confirm(text)){
    return;
  }


  try{

    const url =
      CONFIG.SUPABASE_URL +
      "/rest/v1/" +
      CONFIG.TABLE +
      "?" +
      encodeURIComponent(
        CONFIG.COLUMNS.id
      ) +
      "=eq." +
      encodeURIComponent(id);


    const response =
      await fetch(url,{

        method:"PATCH",

        headers:{

          "apikey":
            CONFIG.SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            CONFIG.SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body:JSON.stringify({

          [CONFIG.COLUMNS.status]:
            status

        })

      });


    if(!response.ok){

      const error =
        await response.text();

      throw new Error(error);

    }


    await loadOrders();


  }catch(error){

    alert(
      "Gagal mengubah status:\n\n" +
      error.message
    );

  }

}


/* ==================================================
   FORMAT
================================================== */

function normalizeStatus(value){

  const s =
    String(value ?? "")
      .trim()
      .toUpperCase();

  if(
    s === "PAID" ||
    s === "DIBAYAR" ||
    s === "SUDAH BAYAR" ||
    s === "SUDAH_DIBAYAR"
  ){
    return "DIBAYAR";
  }

  if(
    s === "REJECTED" ||
    s === "DITOLAK" ||
    s === "REJECT"
  ){
    return "DITOLAK";
  }

  return "MENUNGGU";

}


function formatRupiah(value){

  const number =
    Number(value || 0);

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(number);

}


function formatDate(value){

  if(!value){
    return "-";
  }

  const date =
    new Date(value);

  if(isNaN(date)){
    return escapeHTML(value);
  }

  return date.toLocaleString(
    "id-ID",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* ==================================================
   SECURITY HELPERS
================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJS(value){

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}

</script>

</body>
</html>
