<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shine Store — Admin Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050505;
  color:#f7f4ec;
  font-family:Arial,sans-serif;
  padding:20px;
}

.login{
  width:100%;
  max-width:380px;
  background:#10100f;
  border:1px solid #2c2922;
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
}

.logo span{
  display:block;
  color:#d8b15f;
  font-size:9px;
  letter-spacing:4px;
  margin-top:5px;
}

h2{
  margin-top:28px;
  font-size:18px;
}

p{
  color:#777169;
  font-size:11px;
  margin-top:6px;
}

input{
  width:100%;
  margin-top:20px;
  padding:14px;
  border-radius:12px;
  border:1px solid #302d27;
  background:#080807;
  color:white;
  outline:none;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#d8b15f;
  color:#080706;
  font-weight:900;
  cursor:pointer;
}

#error{
  display:none;
  color:#ff7777;
  font-size:11px;
  margin-top:12px;
  text-align:center;
}
</style>
</head>

<body>

<div class="login">

  <div class="logo">
    SHINE
    <span>ADMIN PANEL</span>
  </div>

  <h2>Login Admin</h2>
  <p>Masukkan password untuk melanjutkan.</p>

  <input
    id="password"
    type="password"
    placeholder="Password admin"
    autocomplete="current-password"
  >

  <button onclick="login()">
    MASUK
  </button>

  <div id="error">
    Password salah.
  </div>

</div>

<script>

async function login(){

  const password =
    document.getElementById('password').value;

  if(!password){
    return;
  }

  const response = await fetch('/api/admin-login',{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      password
    })
  });

  const data = await response.json();

  if(data.success){

    sessionStorage.setItem('shine_admin','true');

    window.location.href='/admin.html';

  }else{

    document.getElementById('error').style.display='block';

  }

}

document.getElementById('password').addEventListener('keydown',function(e){

  if(e.key === 'Enter'){
    login();
  }

});

</script>

</body>
</html>
